<!-- polices chargées avant l'affichage : sans cela le texte des articles bouge quand elles arrivent (décalage mesuré 0,11 à 0,14,
     au-dessus du seuil de 0,1 de Google), et les articles s'affichent déjà en moins d'une seconde -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Nunito:wght@700;800&display=swap">
<style>
/* Pages du guide (articles) : même charte que le comparateur, une colonne de lecture, PC et téléphone. */
:root{
  --bg:#ffffff; --surface:#ffffff; --fg:#0f2430; --muted:#526b77; --line:#d3e2e8;
  --accent:#0a7aa5; --accent-fg:#ffffff; --accent-soft:#e0f2f9; --warn-soft:#fdf1d8; --warn:#7a5200;
  --brand-1:#0e5883; --brand-2:#07a4c7;
  --f-display:"Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-body:"Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0c161b; --surface:#13212a; --fg:#e3eef2; --muted:#9db3bd; --line:#27404c;
  --accent:#4cc3ee; --accent-fg:#06202b; --accent-soft:#143341; --warn-soft:#33290f; --warn:#f0c870;
  --brand-1:#5fb8e6; --brand-2:#3fd6e8; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0c161b; --surface:#13212a; --fg:#e3eef2; --muted:#9db3bd; --line:#27404c;
  --accent:#4cc3ee; --accent-fg:#06202b; --accent-soft:#143341; --warn-soft:#33290f; --warn:#f0c870;
  --brand-1:#5fb8e6; --brand-2:#3fd6e8; color-scheme:dark }
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:17px;line-height:1.6;
  padding:16px max(16px,env(safe-area-inset-right,0px)) 48px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:46rem;margin:0 auto}
a{color:var(--accent)}
.tete{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;padding-bottom:.8rem;border-bottom:1px solid var(--line)}
.tete .logo img{display:block;height:52px;width:auto;border-radius:8px;background:#fff}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none;border-radius:999px;padding:.55rem 1.1rem;font-size:.95rem}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fil{font-size:.85rem;color:var(--muted);margin:.9rem 0 .4rem}
.fil a{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;color:var(--brand-1);text-wrap:balance}
h1{font-size:2rem;font-weight:800;margin:.4rem 0 .8rem}
h2{font-size:1.35rem;font-weight:800;margin:2rem 0 .6rem}
h3{font-size:1.1rem;margin:1.4rem 0 .4rem}
p,li{max-width:70ch}
.chapo{font-size:1.1rem;color:var(--fg);border-left:4px solid var(--accent);padding:.2rem 0 .2rem .9rem;margin:0 0 1.2rem}
.tableau{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:30rem}
th,td{padding:.5rem .65rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700}
tr:last-child td{border-bottom:0}
/* Téléphone : les tableaux de 2 ou 3 colonnes tiennent dans l'écran, sans défilement de côté (les plus larges défilent encore dans leur cadre) */
@media (max-width:540px){table{min-width:0;font-size:.86rem}th,td{padding:.45rem .5rem}}
.faq details{border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;margin:.55rem 0;background:var(--surface)}
.faq summary{cursor:pointer;font-weight:700}
.faq details p{margin:.5rem 0 0}
.sources{font-size:.88rem;color:var(--muted)}
.sources h2{font-size:1.05rem}
.maj{font-size:.85rem;color:var(--muted);margin-top:1.6rem}
.cta{margin:2rem 0;padding:1.1rem 1.2rem;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
.cta p{margin:0 0 .7rem;font-weight:600}
.liste{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.chapitres ul{list-style:none;padding:0;margin:0 0 .4rem;display:flex;flex-wrap:wrap;gap:.45rem}
.chapitres a{display:inline-block;padding:.35rem .75rem;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--accent);font-weight:600;font-size:.9rem;text-decoration:none}
.chapitres a:hover{border-color:var(--accent)}
.chapitre{margin-top:1.8rem;scroll-margin-top:1rem}
.chapitre h2{margin:0 0 .25rem}
.intro-chap{color:var(--muted);margin:0 0 .75rem;font-size:.95rem}
.liste a{display:block;padding:.85rem 1rem;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);background:var(--surface)}
.liste a strong{display:block;color:var(--brand-1);font-family:var(--f-display);font-size:1.05rem;margin-bottom:.15rem}
.liste a span{font-size:.92rem;color:var(--muted)}
.liste a:hover strong{text-decoration:underline}
.pied{font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:.8rem;margin-top:2.4rem}
.pied a{color:var(--accent);font-weight:700}
/* Schéma des dents (article des prothèses dentaires) */
:root{--g:#f3d3d8;--d-fond:#ffffff;--d-trait:#7d939d;--p100:#cbeed8;--p100-t:#1d7a45;--pmai:#fde2ae;--pmai-t:#9a6100;--plib:#e2e8eb;--plib-t:#5f737d}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){--g:#4a2a31;--d-fond:#1b2c35;--d-trait:#9db3bd;--p100:#1c4a30;--p100-t:#6fd49b;--pmai:#4d3910;--pmai-t:#f0c870;--plib:#2a3a42;--plib-t:#b4c6ce} }
:root[data-theme="dark"]{--g:#4a2a31;--d-fond:#1b2c35;--d-trait:#9db3bd;--p100:#1c4a30;--p100-t:#6fd49b;--pmai:#4d3910;--pmai-t:#f0c870;--plib:#2a3a42;--plib-t:#b4c6ce}
.schema-dents{margin:1.4rem 0;padding:1rem 1rem .4rem;border:1px solid var(--line);border-radius:14px;background:var(--surface)}
.schema-dents figcaption{font-family:var(--f-display);font-weight:800;color:var(--brand-1);font-size:1.1rem;margin-bottom:.3rem}
.sd-aide{font-size:.9rem;color:var(--muted);margin:0 0 .5rem}
.sd-svg{display:block;width:100%;max-width:34rem;height:auto;margin:0 auto}
.sd-svg text{font-family:var(--f-body);text-anchor:middle;fill:var(--fg)}
.sd-nom{font-size:11.5px;font-weight:700}
.sd-sous{font-size:10px;fill:var(--muted)!important}
.sd-gencive{fill:var(--g)}
.sd-trait{fill:none;stroke:var(--d-trait);stroke-width:1}
.sd-dent{fill:var(--d-fond);stroke:var(--d-trait);stroke-width:1.2}
.d100{fill:var(--p100);stroke:var(--p100-t);stroke-width:1.4}
.dmai{fill:var(--pmai);stroke:var(--pmai-t);stroke-width:1.4}
.dlib{fill:var(--plib);stroke:var(--plib-t);stroke-width:1.4}
.sd-legende{list-style:none;padding:0;margin:.6rem 0 .8rem;display:grid;gap:.35rem;font-size:.92rem}
.sd-legende li{display:grid;grid-template-columns:.95rem 1fr;gap:.55rem;align-items:start}
.sd-legende i{flex:none;width:.95rem;height:.95rem;border-radius:4px;border:1.5px solid;margin-top:.25rem}
.sd-legende i.d100{background:var(--p100);border-color:var(--p100-t)}
.sd-legende i.dmai{background:var(--pmai);border-color:var(--pmai-t)}
.sd-legende i.dlib{background:var(--plib);border-color:var(--plib-t)}
.sd-mat{border-top:1px solid var(--line);padding:.7rem 0 .2rem}
.sd-mat-nom{font-weight:700;margin:0 0 .3rem}
.sd-mat-txt{font-size:.9rem;color:var(--muted);margin:.35rem 0 .3rem}
@media (max-width:599px){body{font-size:16px}h1{font-size:1.6rem}h2{font-size:1.2rem}.tete .logo img{height:44px}.btn{padding:.5rem .9rem;font-size:.9rem}}
