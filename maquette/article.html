*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

.tete .logo img{display:block;height:52px;width:auto;border-radius:8px;background:#fff}
.btn{display:inline-block;background:var(--accent);color:var(--accent-fg);font-weight:700;text-decoration:none;border-radius:999px;padding:.55rem 1.1rem;font-size:.95rem}
.btn:focus-visible,a:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.fil{font-size:.85rem;color:var(--muted);margin:.9rem 0 .4rem}
.fil a{color:var(--muted)}
h1,h2,h3{font-family:var(--f-display);line-height:1.25;color:var(--brand-1);text-wrap:balance}
h1{font-size:2rem;font-weight:800;margin:.4rem 0 .8rem}
h2{font-size:1.35rem;font-weight:800;margin:2rem 0 .6rem}
h3{font-size:1.1rem;margin:1.4rem 0 .4rem}
p,li{max-width:70ch}
.chapo{font-size:1.1rem;color:var(--fg);border-left:4px solid var(--accent);padding:.2rem 0 .2rem .9rem;margin:0 0 1.2rem}
.tableau{overflow-x:auto;margin:1rem 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.93rem;min-width:30rem}
th,td{padding:.5rem .65rem;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{background:var(--accent-soft);font-weight:700}
tr:last-child td{border-bottom:0}
.faq details{border:1px solid var(--line);border-radius:10px;padding:.6rem .9rem;margin:.55rem 0;background:var(--surface)}
.faq summary{cursor:pointer;font-weight:700}
.faq details p{margin:.5rem 0 0}
.sources{font-size:.88rem;color:var(--muted)}
.sources h2{font-size:1.05rem}
.maj{font-size:.85rem;color:var(--muted);margin-top:1.6rem}
.cta{margin:2rem 0;padding:1.1rem 1.2rem;border-radius:14px;background:var(--accent-soft);border:1px solid var(--line)}
.cta p{margin:0 0 .7rem;font-weight:600}
.liste{list-style:none;padding:0;margin:0;display:grid;gap:.7rem}
.liste a{display:block;padding:.85rem 1rem;border:1px solid var(--line);border-radius:12px;text-decoration:none;color:var(--fg);background:var(--surface)}
.liste a strong{display:block;color:var(--brand-1);font-family:var(--f-display);font-size:1.05rem;margin-bottom:.15rem}
.liste a span{font-size:.92rem;color:var(--muted)}
.liste a:hover strong{text-decoration:underline}
.pied{font-size:.8rem;color:var(--muted);text-align:center;border-top:1px solid var(--line);padding-top:.8rem;margin-top:2.4rem}
.pied a{color:var(--accent);font-weight:700}
@media (max-width:599px){body{font-size:16px}h1{font-size:1.6rem}h2{font-size:1.2rem}.tete .logo img{height:44px}.btn{padding:.5rem .9rem;font-size:.9rem}}
